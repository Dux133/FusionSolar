
name: Zbuduj FusionSolar Monitor APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sprawdz Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Android API 34
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Kompilacja APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Przygotuj APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FusionSolar_Monitor_Xiaomi.apk

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: FusionSolar_Monitor_Xiaomi_APK
          path: FusionSolar_Monitor_Xiaomi.apk
          if-no-files-found: error
